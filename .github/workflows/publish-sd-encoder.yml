name: Publish SD Encoder

on:
  push:
    branches:
      - main
    tags:
      - "sd_encoder-v*"
    paths:
      - "sd_encoder/sd_encoder/**"
      - "sd_encoder/README.md"
      - ".github/workflows/publish-sd-encoder.yml"
  pull_request:
    paths:
      - "sd_encoder/sd_encoder/**"
      - "sd_encoder/README.md"
      - ".github/workflows/publish-sd-encoder.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish target"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sd_encoder/sd_encoder
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: auto
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: sd-encoder-linux-${{ matrix.target }}
          path: sd_encoder/sd_encoder/dist

  macos:
    name: Build macOS wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sd_encoder/sd_encoder
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: sd-encoder-macos-${{ matrix.target }}
          path: sd_encoder/sd_encoder/dist

  windows:
    name: Build Windows wheels
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sd_encoder/sd_encoder
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: sd-encoder-windows-${{ matrix.target }}
          path: sd_encoder/sd_encoder/dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: sd_encoder/sd_encoder
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sd-encoder-sdist
          path: sd_encoder/sd_encoder/dist

  publish:
    name: Publish SD Encoder
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: |
      startsWith(github.ref, 'refs/tags/sd_encoder-v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish != 'none')
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          verbose: true

      - name: Publish to PyPI
        if: |
          startsWith(github.ref, 'refs/tags/sd_encoder-v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
