[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "clm-core"
dynamic = ["version", "readme"]
description = "Thread and prompt encoder components for Compressed Language Model workflows."
license = "MIT"
requires-python = ">=3.11"

authors = [
    { name = "Yanick Andrade", email = "info@clm-lang.com" },
]
homepage = "https://github.com/YanickJair/cllm"
repository = "https://github.com/YanickJair/cllm"
documentation = "https://github.com/YanickJair/cllm"
keywords = [
  "Natural Language Compression",
  "LLM Compressor",
  "Compressed Language Model",
  "CLM",
  "NLP",
  "Text Compression",
  "Structure Data Compression",
  "System Prompt Compressor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "spacy>=3.8.7",
    "pydantic>=2.12.5",
    "langdetect>=1.0.9",
    "annotated-doc>=0.0.4",
    "click>=8.3.1",
    "pretty-loguru>=1.2.0",
]
[project.optional-dependencies]
sd_encoder = ["sd_encoder>=0.1.3"]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pip>=26.0.1",
    "pytest-mock>=3.15.1",
    "tiktoken>=0.13.0",
    "openai>=2.46.0",
]

[tool.hatch.version]
path = "clm_core/__version__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/CHANGELOG.md",
    "/clm_core",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["clm_core"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# REMOVED CHANGELOG FRAGMENTS - Add back when CHANGELOG.md is ready
# [[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
# text = "\n## Release Information\n\n"
#
# [[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
# path = "CHANGELOG.md"
# pattern = "\n(###.+?\n)## "
#
# [[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
# text = "\n---\n\n[Full changelog](https://github.com/YanickJair/cllm/blob/master/CHANGELOG.md)\n"

# [[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# pattern = 'src="(docs/img/.*?)"'
# replacement = 'src="https://raw.githubusercontent.com/YanickJair/cllm/master/\1"'

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PIE"]
ignore = ["B904", "B028"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
omit = ["venv/*", ".venv/*", "scripts/*"]
include = ["clm_core/*", "tests/*"]
